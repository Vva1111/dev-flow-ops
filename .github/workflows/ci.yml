name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: pnpm 설치
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: pnpm 저장소 캐시
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Finance E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: pnpm 설치
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: pnpm 저장소 캐시
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Chromium 및 OS 의존성 설치
        run: pnpm --filter @devflowops/finance-web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: E2E 보고서 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: finance-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/finance-web/playwright-report/
            apps/finance-web/test-results/
          if-no-files-found: ignore
          retention-days: 7
